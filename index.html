<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 97%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        .resultado { margin-top: 20px; padding: 10px; background-color: #e2e3e5; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora de IMC</h2>
    
    <form action="/" method="POST">
        <input type="number" step="0.1" name="peso" placeholder="Peso (ex: 70.5 Kg)" required>
        <input type="number" step="0.01" name="altura" placeholder="Altura (ex: 1.75 m)" required>
        <button type="submit">Calcular</button>
    </form>

    {% if classificacao %}
        <div class="resultado">
            {% if imc %}
                <p><strong>Seu IMC:</strong> {{ imc }}</p>
            {% endif %}
            <p><strong>Situação:</strong> {{ classificacao }}</p>
        </div>
    {% endif %}
</div>

</body>
</html>
